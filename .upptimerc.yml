      - "User-Agent: NueveOnce-Estado/1.0 (+https://status.nueveonce.com/)"
    __dangerous__body_down_if_text_missing: "<title>Encuesta NueveOnce</title>"
    icon: https://status.nueveonce.com/iconos/nueveonce.png

# No theme key: the site follows the visitor's light or dark preference.
status-website:
  cname: status.nueveonce.com
  name: Estado de NueveOnce
  introTitle: Estado de los servicios de NueveOnce
  introMessage: Revisamos nuestras plataformas automáticamente cada pocos minutos. Aquí puedes consultar su disponibilidad, los incidentes y los mantenimientos programados.
  logoUrl: https://status.nueveonce.com/logo-nueveonce.svg
  favicon: https://status.nueveonce.com/favicon.png
  faviconSvg: https://status.nueveonce.com/favicon.svg
  navbar:
    - title: Estado
      href: https://status.nueveonce.com/
    - title: Soporte
      href: "https://www.nueveonce.com/contacto"
  productionCacheTime: 300000
  metaTags:
    - name: description
      content: "Estado de los servicios de NueveOnce: disponibilidad, incidentes y mantenimientos programados."
    # Pilot only: remove the robots tag at launch.
    - name: robots
      content: noindex
  links:
    - rel: stylesheet
      href: https://status.nueveonce.com/estado-es.css
  scripts:
    - src: https://status.nueveonce.com/estado-es.js

