# Upptime configuration for the NueveOnce public status page.
# This repository is public: list only public endpoints, and never put "$" in a
# site field, because Upptime substitutes environment variables (including the
# bot token) into URLs, headers and body checks.
owner: Grupo-Nuevo-Once
repo: nueveonce-status
user-agent: nueveonce-status

assignees: []
secrets: []

skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true
skipPoweredByReadme: true
skipDeleteIssues: true

# Only the author is set. The commit messages keep Upptime's defaults because
# Upptime and the site parse them.
commitMessages:
  commitAuthorName: "nueveonce-status[bot]"
  commitAuthorEmail: "355641071+nueveonce-status[bot]@users.noreply.github.com"

sites:
  - name: API SIGNO
    slug: api-signo
    url: https://api.signo.nueveonce.com/api/health/ready
    expectedStatusCodes: [200]
    maxRedirects: 0
    maxResponseTime: 3000
    connectTimeout: 10
    requestTimeout: 10
    maxRetries: 2
    headers:
      - "User-Agent: NueveOnce-Estado/1.0 (+https://status.nueveonce.com/)"
    __dangerous__body_down_if_text_missing: '"status":"ok"'
    icon: https://status.nueveonce.com/iconos/signo.png
  - name: Dashboard SIGNO
    slug: dashboard-signo
    url: https://signo.nueveonce.com/
    expectedStatusCodes: [200]
    maxRedirects: 0
    maxResponseTime: 3000
    connectTimeout: 10
    requestTimeout: 10
    maxRetries: 2
    headers:
      - "User-Agent: NueveOnce-Estado/1.0 (+https://status.nueveonce.com/)"
    __dangerous__body_down_if_text_missing: "<title>SIGNO</title>"
    icon: https://status.nueveonce.com/iconos/signo.png
  - name: API de integraciones
    slug: api-integraciones
    url: https://integrations.nueveonce.com/integrations/v1/health
    expectedStatusCodes: [200]
    maxRedirects: 0
    maxResponseTime: 3000
    connectTimeout: 10
    requestTimeout: 10
    maxRetries: 2
    headers:
      - "User-Agent: NueveOnce-Estado/1.0 (+https://status.nueveonce.com/)"
    __dangerous__body_down_if_text_missing: '"status":"ok"'
    icon: https://status.nueveonce.com/iconos/nueveonce.png
  - name: Portal de desarrolladores
    slug: portal-desarrolladores
    url: https://developers.nueveonce.com/
    expectedStatusCodes: [200]
    maxRedirects: 0
    maxResponseTime: 3000
    connectTimeout: 10
    requestTimeout: 10
    maxRetries: 2
    headers:
      - "User-Agent: NueveOnce-Estado/1.0 (+https://status.nueveonce.com/)"
    __dangerous__body_down_if_text_missing: "NueveOnce Developers"
    icon: https://status.nueveonce.com/iconos/nueveonce.png
  - name: Telemedicina (web)
    slug: telemedicina-web
    url: https://telemedicine.nueveonce.com/
    expectedStatusCodes: [200]
    maxRedirects: 0
    maxResponseTime: 3000
    connectTimeout: 10
    requestTimeout: 10
    maxRetries: 2
    headers:
      - "User-Agent: NueveOnce-Estado/1.0 (+https://status.nueveonce.com/)"
    __dangerous__body_down_if_text_missing: "NueveOnce Telemedicina"
    icon: https://status.nueveonce.com/iconos/nueveonce.png
  # The page title has an accent; the check uses an unaccented substring of it.
  - name: Aquí Contigo (web)
    slug: aqui-contigo-web
    url: https://aquicontigo.nueveonce.com/
    expectedStatusCodes: [200]
    maxRedirects: 0
    maxResponseTime: 3000
    connectTimeout: 10
    requestTimeout: 10
    maxRetries: 2
    headers:
      - "User-Agent: NueveOnce-Estado/1.0 (+https://status.nueveonce.com/)"
    __dangerous__body_down_if_text_missing: "Contigo</title>"
    icon: https://status.nueveonce.com/iconos/nueveonce.png
  - name: App web de pacientes
    slug: app-pacientes-web
    url: https://app.nueveonce.com/
    expectedStatusCodes: [200]
    maxRedirects: 0
    maxResponseTime: 3000
    connectTimeout: 10
    requestTimeout: 10
    maxRetries: 2
    headers:
      - "User-Agent: NueveOnce-Estado/1.0 (+https://status.nueveonce.com/)"
    __dangerous__body_down_if_text_missing: "<title>Nueve once</title>"
    icon: https://status.nueveonce.com/iconos/nueveonce.png
  - name: Encuestas
    slug: encuestas
    url: https://encuestas.nueveonce.com/
