# Frozen at Upptime v1.46.5 (template 03eff77); edited by hand through PRs.
# Template: https://github.com/upptime/upptime/blob/03eff77cc27111e7c1229a05df76326744dfa443/.github/workflows/summary.yml
# Upptime (https://upptime.js.org) is MIT licensed. Nothing regenerates this file, so the
# .upptimerc.yml keys that only shaped the generated workflows (workflowSchedule, runner)
# have no effect here.
#
# Changes from the template:
# - The token comes only from the GitHub App, whose key is a secret of the "estado"
#   environment. No fallback to a personal token or GITHUB_TOKEN: without the key it fails.
# - GITHUB_TOKEN gets no permissions, and the App token only what this job needs.
# - Every action is pinned to a full commit SHA.

name: Summary CI
on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [summary]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Generate README
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # deployment: false reads the environment's secret without creating a deployment record.
    environment:
      name: estado
      deployment: false
    steps:
      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # Push the README and history/summary.json; uptime is computed from incident issues.
          permission-contents: write
          permission-issues: read
      # Credentials stay persisted on purpose: uptime-monitor pushes its commits with git.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.app_token.outputs.token }}
      - name: Update summary in README
        uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc # v1.46.5
        with:
          command: "readme"
        env:
          GH_PAT: ${{ steps.app_token.outputs.token }}
