# Frozen at Upptime v1.46.5 (template 03eff77); edited by hand through PRs.
# Template: https://github.com/upptime/upptime/blob/03eff77cc27111e7c1229a05df76326744dfa443/.github/workflows/setup.yml
# Upptime (https://upptime.js.org) is MIT licensed. Nothing regenerates this file, so the
# .upptimerc.yml keys that only shaped the generated workflows (workflowSchedule, runner,
# secrets, status-website.singleCommit, the Pages commit identity) have no effect here.
#
# Changes from the template:
# - No "Update template" step: the workflows are frozen and only change through PRs.
# - Runs on pushes to master only, and only master publishes to GitHub Pages.
# - No npm code runs where the GitHub App key of the "estado" environment is:
#   - "release" runs only pinned code. It keeps persisted git credentials because
#     uptime-monitor pushes its commits with git.
#   - Graphs CI generates the graphs; "release" only dispatches it. The template's fallback,
#     which ran npx @upptime/graphs in this job when the dispatch failed, is gone.
#   - "build" and "deploy" build and publish the site as in site.yml: the unpinned
#     @upptime/status-page package runs in "build", which has no environment, no secret and
#     a GITHUB_TOKEN limited to contents: read; "deploy" publishes its artifact with the
#     App's write token.
# - Each job uses one token, named in the job, with no fallback. Without the key, the jobs
#   that need it fail.
# - GITHUB_TOKEN gets no permissions where the App token is used, and each App token only
#   what its job needs.
# - Every action is pinned to a full commit SHA.
# - SECRETS_CONTEXT is empty, so no notification secret reaches Upptime.
# - The gh-pages commits are authored by the App bot.

name: Setup CI
on:
  push:
    branches:
      - master
    paths:
      - ".upptimerc.yml"
  repository_dispatch:
    types: [setup]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Setup Upptime
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # deployment: false reads the environment's secret without creating a deployment record.
    environment:
      name: estado
      deployment: false
    steps:
      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # Push history and README commits; open incident issues for sites that are
          # already down; dispatch Graphs CI.
          permission-actions: write
          permission-contents: write
          permission-issues: write
      # Credentials stay persisted on purpose: uptime-monitor pushes its commits with git.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.app_token.outputs.token }}
      - name: Update response time
        uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc # v1.46.5
        with:
          command: "response-time"
        env:
          GH_PAT: ${{ steps.app_token.outputs.token }}
          SECRETS_CONTEXT: '{}'
      - name: Update summary in README
        uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc # v1.46.5
        with:
          command: "readme"
        env:
          GH_PAT: ${{ steps.app_token.outputs.token }}
      # The dispatched run waits for this one, because both share the concurrency group, and
      # GitHub cancels it if another Upptime run queues behind it first. In that case, or if the
      # dispatch fails, the graphs catch up on Graphs CI's daily schedule. They only feed the
      # cards' background image and the README's chart and badges.
      - name: Generate graphs
        id: dispatch_graphs
        uses: benc-uk/workflow-dispatch@d004979be141727c7a17c28f603e2facc40d0855 # v1.3.3
        continue-on-error: true
        with:
          workflow: Graphs CI
          token: ${{ steps.app_token.outputs.token }}
      - name: Report a failed Graphs CI dispatch
        if: steps.dispatch_graphs.outcome == 'failure'
        run: |
          echo "::warning title=Graphs CI::No se pudo despachar Graphs CI. Las gráficas se actualizarán en su ejecución diaria de las 00:00 UTC, o puedes lanzarlo a mano."
  build:
    name: Build site
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Checks out the branch, not the triggering commit, to include the first job's pushes.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ github.token }}
          persist-credentials: false
      # uptime-monitor reads the repository's metadata with GH_PAT, then builds the site with
      # npm; the status-page build itself reads no token.
      - name: Generate site
        uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc # v1.46.5
        with:
          command: "site"
        env:
          GH_PAT: ${{ github.token }}
      - name: Upload site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/status-page/__sapper__/export/
          if-no-files-found: error
          retention-days: 1
  deploy:
    name: Deploy site
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # deployment: false reads the environment's secret without creating a deployment record.
    environment:
      name: estado
      deployment: false
    steps:
      - name: Download site
        id: site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site
      - name: Create GitHub App token for the Pages deploy
        id: deploy_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: GitHub Pages Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ steps.deploy_token.outputs.token }}
          publish_dir: ${{ steps.site.outputs.download-path }}
          force_orphan: "false"
          user_name: "nueveonce-estado[bot]"
          user_email: "355641071+nueveonce-estado[bot]@users.noreply.github.com"
