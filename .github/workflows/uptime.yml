# Frozen at Upptime v1.46.5 (template 03eff77); edited by hand through PRs.
# Template: https://github.com/upptime/upptime/blob/03eff77cc27111e7c1229a05df76326744dfa443/.github/workflows/uptime.yml
# Upptime (https://upptime.js.org) is MIT licensed. Nothing regenerates this file, so the
# .upptimerc.yml keys that only shaped the generated workflows (workflowSchedule, runner,
# secrets) have no effect here.
#
# Changes from the template:
# - The token comes only from the GitHub App, whose key is a secret of the "estado"
#   environment. No fallback to a personal token or GITHUB_TOKEN: without the key it fails.
# - GITHUB_TOKEN gets no permissions, and the App token only what this job needs.
# - Every action is pinned to a full commit SHA.
# - SECRETS_CONTEXT is empty, so no notification secret reaches Upptime.
# - The schedule runs at minute 2 of each 5-minute slot instead of minute 0.

name: Uptime CI
on:
  schedule:
    # GitHub delays and drops scheduled runs most often at the top of the hour.
    - cron: "2-59/5 * * * *"
  repository_dispatch:
    types: [uptime]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    # If every site accepts the connection and never answers, the checks alone take 10 minutes
    # (8 sites x 75 s with requestTimeout 10 and maxRetries 2 in .upptimerc.yml). The only push
    # comes after the last site, so a run cut short by the timeout records nothing.
    timeout-minutes: 25
    # deployment: false reads the environment's secret without creating a deployment
    # record, so the 5-minute schedule does not add one per run.
    environment:
      name: estado
      deployment: false
    steps:
      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # Push history commits; open, comment on, close and lock incident issues.
          permission-contents: write
          permission-issues: write
      # Credentials stay persisted on purpose: uptime-monitor pushes its commits with git.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.app_token.outputs.token }}
      - name: Check endpoint status
        uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc # v1.46.5
        with:
          command: "update"
        env:
          GH_PAT: ${{ steps.app_token.outputs.token }}
          SECRETS_CONTEXT: '{}'
