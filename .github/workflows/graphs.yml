# Frozen at Upptime v1.46.5 (template 03eff77); edited by hand through PRs.
# Template: https://github.com/upptime/upptime/blob/03eff77cc27111e7c1229a05df76326744dfa443/.github/workflows/graphs.yml
# Upptime (https://upptime.js.org) is MIT licensed. Nothing regenerates this file, so the
# .upptimerc.yml keys that only shaped the generated workflows (workflowSchedule, runner)
# have no effect here.
#
# Changes from the template:
# - Two jobs instead of uptime-monitor's "graphs" command, which runs npx and pushes from the
#   same process, so that no npm code runs where the GitHub App key is:
#   - "build" runs the generation half of that command (src/graphs.ts at v1.46.5). It has no
#     environment and no secret, reads the repository with a GITHUB_TOKEN limited to
#     contents: read, keeps no git credentials, and hands the files over as an artifact.
#   - "commit" runs on master only, holds the App key of the "estado" environment and runs no
#     npm code. It accepts only the files @upptime/graphs writes, for the components that
#     .github/scripts/componentes.json lists in its own checkout and at most 1 MiB each, and
#     commits them with the command's message and identity (commitMessages in .upptimerc.yml),
#     adding graphs/ and api/ instead of ".".
# - imagemin-cli is not run; the "Generate graphs" step says why.
# - Each job uses one token, named in the job, with no fallback: "build" the read-only
#   GITHUB_TOKEN, "commit" the App token. Without the key the commit fails.
# - Every action is pinned to a full commit SHA.
# - setup-node restores no dependency cache.

name: Graphs CI
on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [graphs]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  build:
    name: Generate graphs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ github.token }}
          persist-credentials: false
      - name: Setup Node.js for graphs
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "20"
          token: ${{ github.token }}
          package-manager-cache: false
      # @upptime/graphs reads history/summary.json, lists the commits of history/<slug>.yml
      # with GH_PAT, and writes graphs/<slug>/response-time*.png and api/<slug>/*.json.
      # graphs.ts then runs "npx imagemin-cli graphs/* --out-dir=graphs" and deletes
      # graphs/response-time*.png. Both are left out: imagemin 9 writes each image to the
      # output directory under its base name, so that call only creates those five files.
      - name: Generate graphs
        env:
          GH_PAT: ${{ github.token }}
        run: npx --yes @upptime/graphs
      - name: Upload graphs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: graphs
          path: |
            graphs/
            api/
          if-no-files-found: error
          retention-days: 1
  commit:
    name: Commit graphs
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # deployment: false reads the environment's secret without creating a deployment record.
    environment:
      name: estado
      deployment: false
    steps:
      - name: Create GitHub App token
        id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          # Push the graphs commit.
          permission-contents: write
      # Credentials stay persisted on purpose: the last step pushes with git.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.app_token.outputs.token }}
      # Outside the checkout, so nothing in the artifact can land in .git.
      - name: Download graphs
        id: graphs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: graphs
          path: ${{ runner.temp }}/graphs
      - name: Commit graphs
        env:
          ARTIFACT_DIR: ${{ steps.graphs.outputs.download-path }}
          COMMIT_AUTHOR_NAME: "nueveonce-estado[bot]"
          COMMIT_AUTHOR_EMAIL: "355641071+nueveonce-estado[bot]@users.noreply.github.com"
          LC_ALL: C
        run: |
          set -euo pipefail
          # The artifact was built by unpinned code, so only the files @upptime/graphs writes
          # are accepted: for the components that .github/scripts/componentes.json lists in this
          # checkout, never a list the artifact brings, and at most 1 MiB each. Any other name, a
          # symlink, any other kind of entry or a larger file stops the job before anything
          # reaches the repository.
          filter='if type == "array" and length > 0 then .[].slug | @json else error("no es una lista de componentes") end'
          if ! list="$(jq -r "$filter" .github/scripts/componentes.json)"; then
            echo "::error title=Graphs CI::No se pudo leer la lista de componentes de .github/scripts/componentes.json. No se publicó nada."
            exit 1
          fi
          # Each slug as validar.js accepts it, so that it adds only itself to the patterns.
          slug_re='^"([a-z0-9][a-z0-9-]*)"$'
          slugs=''
          while IFS= read -r line; do
            if [[ ! $line =~ $slug_re ]]; then
              printf 'Slug no válido: %q\n' "$line"
              echo "::error title=Graphs CI::La lista de componentes trae un slug no válido. No se publicó nada."
              exit 1
            fi
            slugs="${slugs:+$slugs|}${BASH_REMATCH[1]}"
          done <<<"$list"
          dir_re='^\./(graphs|api)(/('"$slugs"'))?$'
          png_re='^\./graphs/('"$slugs"')/response-time(-day|-week|-month|-year)?\.png$'
          json_re='^\./api/('"$slugs"')/(uptime|response-time)(-day|-week|-month|-year)?\.json$'
          entries="$RUNNER_TEMP/graphs-entries"
          (cd "$ARTIFACT_DIR" && find . -mindepth 1 -print0) > "$entries"
          unexpected=0
          while IFS= read -r -d '' entry; do
            path="$ARTIFACT_DIR/${entry#./}"
            if [ -L "$path" ]; then
              allowed=false
            elif [ -d "$path" ]; then
              [[ $entry =~ $dir_re ]] && allowed=true || allowed=false
            elif [ -f "$path" ]; then
              [[ $entry =~ $png_re || $entry =~ $json_re ]] && allowed=true || allowed=false
            else
              allowed=false
            fi
            if [ "$allowed" = false ]; then
              printf 'Entrada inesperada: %q\n' "$entry"
              unexpected=1
            fi
          done < "$entries"
          large="$RUNNER_TEMP/graphs-large"
          (cd "$ARTIFACT_DIR" && find . -type f -size +1048576c -print0) > "$large"
          while IFS= read -r -d '' entry; do
            printf 'Archivo de más de 1 MiB: %q\n' "$entry"
            unexpected=1
          done < "$large"
          if [ "$unexpected" -ne 0 ] || [ ! -d "$ARTIFACT_DIR/graphs" ] || [ ! -d "$ARTIFACT_DIR/api" ]; then
            echo "::error title=Graphs CI::El artefacto trae algo más que las gráficas y los JSON de @upptime/graphs para los componentes de componentes.json, o un archivo de más de 1 MiB. No se publicó nada."
            exit 1
          fi
          cp -R -- "$ARTIFACT_DIR/graphs" "$ARTIFACT_DIR/api" .
          # commit() and push() of uptime-monitor, with its identity and message, adding only
          # graphs/ and api/ instead of ".".
          git config --local user.email "$COMMIT_AUTHOR_EMAIL"
          git config --local user.name "$COMMIT_AUTHOR_NAME"
          git add -- graphs api
          if git diff --cached --quiet; then
            echo "Las gráficas no cambiaron; no hay nada que publicar."
            exit 0
          fi
          git commit -m ":bento: Update graphs [skip ci]"
          git push
