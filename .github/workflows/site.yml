# Frozen at Upptime v1.46.5 (template 03eff77); edited by hand through PRs.
# Template: https://github.com/upptime/upptime/blob/03eff77cc27111e7c1229a05df76326744dfa443/.github/workflows/site.yml
# Upptime (https://upptime.js.org) is MIT licensed. Nothing regenerates this file, so the
# .upptimerc.yml keys that only shaped the generated workflows (workflowSchedule, runner,
# status-website.singleCommit, the Pages commit identity) have no effect here.
#
# Changes from the template:
# - Runs on pushes to master only, and only master publishes to GitHub Pages.
# - Two jobs instead of one, so that no npm code runs where the GitHub App key is:
#   - "build" installs and runs the unpinned @upptime/status-page package. It has no
#     environment and no secret, reads the repository with a GITHUB_TOKEN limited to
#     contents: read, keeps no git credentials, and hands the site over as an artifact.
#   - "deploy" holds the App key of the "estado" environment and runs only pinned actions:
#     it downloads the artifact, mints the App's write token and publishes.
# - Each job uses one token, named in the job, with no fallback: "build" the read-only
#   GITHUB_TOKEN, "deploy" the App token. Without the key the deploy fails.
# - Every action is pinned to a full commit SHA.
# - The gh-pages commits are authored by the App bot.

name: Static Site CI
on:
  push:
    branches:
      - master
    paths:
      - "assets/**"
  schedule:
    - cron: "0 1 * * *"
  repository_dispatch:
    types: [static_site]
  workflow_dispatch:
permissions: {}
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ github.token }}
          persist-credentials: false
      # uptime-monitor reads the repository's metadata with GH_PAT, then builds the site with
      # npm; the status-page build itself reads no token.
      - name: Generate site
        uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc # v1.46.5
        with:
          command: "site"
        env:
          GH_PAT: ${{ github.token }}
      - name: Upload site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/status-page/__sapper__/export/
          if-no-files-found: error
          retention-days: 1
  deploy:
    name: Deploy site
    needs: build
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # deployment: false reads the environment's secret without creating a deployment record.
    environment:
      name: estado
      deployment: false
    steps:
      - name: Download site
        id: site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site
      - name: Create GitHub App token for the Pages deploy
        id: deploy_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: GitHub Pages Deploy
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ steps.deploy_token.outputs.token }}
          publish_dir: ${{ steps.site.outputs.download-path }}
          force_orphan: "false"
          user_name: "nueveonce-estado[bot]"
          user_email: "355641071+nueveonce-estado[bot]@users.noreply.github.com"
