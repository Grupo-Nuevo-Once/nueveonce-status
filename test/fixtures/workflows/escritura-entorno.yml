# Negative fixture for the "escritura-github" rule: the documented exception, GITHUB_TOKEN writing
# issues, in a job with an environment, where it does not apply.
name: Escritura con environment
on: workflow_dispatch
permissions: {}
jobs:
  comentar:
    runs-on: ubuntu-latest
    environment: produccion
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: core.info('ok')
