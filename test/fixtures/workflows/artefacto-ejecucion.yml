# Negative fixture for the "artefacto" rule: the job that holds the App key downloads an artifact
# from another run, which a pull request's run may have uploaded, and publishes it.
name: Artefacto de otra ejecucion
on: workflow_dispatch
permissions: {}
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: estado
      deployment: false
    steps:
      - id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-contents: write
      - id: site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site
          run-id: "1234567890"
          github-token: ${{ steps.app_token.outputs.token }}
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ steps.app_token.outputs.token }}
          publish_dir: ${{ steps.site.outputs.download-path }}
