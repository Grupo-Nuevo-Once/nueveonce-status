# Negative fixture for the "npm-con-llave" rule: the root's default shell runs through npx, so every
# "run" step of the job that holds the App key would run npm code.
name: npm en la raiz
on: workflow_dispatch
permissions: {}
defaults:
  run:
    shell: "npx --yes some-shell {0}"
jobs:
  revisar:
    runs-on: ubuntu-latest
    environment:
      name: estado
      deployment: false
    steps:
      - id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc # v1.46.5
        with:
          command: "update"
        env:
          GH_PAT: ${{ steps.app_token.outputs.token }}
