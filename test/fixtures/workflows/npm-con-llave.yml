# Negative fixture for the "npm-con-llave" rule: npx runs unpinned npm code in the job that holds
# the App key.
name: npm con llave
on: workflow_dispatch
permissions: {}
jobs:
  graficas:
    runs-on: ubuntu-latest
    environment:
      name: estado
      deployment: false
    steps:
      - id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
      - name: Generar
        env:
          GH_PAT: ${{ steps.app_token.outputs.token }}
        run: npx --yes @upptime/graphs
