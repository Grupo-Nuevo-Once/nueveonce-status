# Negative fixture for the "npm-con-llave" rule: uptime-monitor's "site" command installs and
# builds @upptime/status-page with npm, here next to the App key.
name: npm con llave (site)
on: workflow_dispatch
permissions: {}
jobs:
  sitio:
    runs-on: ubuntu-latest
    environment: estado
    steps:
      - id: app_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: upptime/uptime-monitor@74f0683383384927e064d76a5f21f340d6af36fc # v1.46.5
        with:
          command: "site"
        env:
          GH_PAT: ${{ steps.app_token.outputs.token }}
