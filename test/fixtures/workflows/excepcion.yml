# Positive fixture for the documented exception: a job without an environment that runs no npm code
# lets GITHUB_TOKEN, its only token, write issues and pull requests, and may name it.
name: Excepcion documentada
on:
  issues:
    types: [opened]
  workflow_dispatch:
permissions: {}
jobs:
  bloquear:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: master
          persist-credentials: false
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          github-token: ${{ github.token }}
          script: |
            const { run } = require('./.github/scripts/candado.js');
            await run({ github, context, core });
