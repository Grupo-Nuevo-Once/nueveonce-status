# Negative fixture for the "secretos" rule: a fallback from the App token to a personal token, a
# second identity with write access.
name: Secreto de respaldo
on: workflow_dispatch
permissions: {}
jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: estado
      deployment: false
    steps:
      - id: site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/site
      - id: deploy_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ steps.deploy_token.outputs.token || secrets.GH_PAT }}
          publish_dir: ${{ steps.site.outputs.download-path }}
