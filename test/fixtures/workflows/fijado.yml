# Positive fixture for the "pin" rule: every "uses:" names a full commit SHA or a local action.
name: Fijado
on: workflow_dispatch
permissions: {}
jobs:
  ejemplo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: "actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd" # v8.0.0
        with:
          script: core.info('ok')
      - uses: ./.github/actions/local
  reutilizable:
    uses: actions/reusable/.github/workflows/x.yml@d23441a48e516b6c34aea4fa41551a30e30af803
