# Negative fixture for the "disparadores" rule: pull_request_target runs master's workflow, with
# secrets and a write token, for a pull request from any fork.
name: Disparador pull_request_target
on: pull_request_target
permissions: {}
jobs:
  ejemplo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
