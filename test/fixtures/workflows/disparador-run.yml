# Negative fixture for the "disparadores" rule: workflow_run runs master's workflow after another
# workflow, a fork's pull request run included.
name: Disparador workflow_run
on:
  workflow_run:
    workflows: [Validar]
    types: [completed]
permissions: {}
jobs:
  ejemplo:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
